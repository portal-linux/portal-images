[Distribution]
Distribution=fedora
Release=41
Architecture=arm64

[Build]
# the ubuntu ci runner has no dnf; build a small bootstrap tools tree that
# does, rather than requiring the host itself to carry fedora's tooling.
ToolsTree=default

[Output]
Format=directory
Output=rootfs

[Content]
# minimal desktop guest: sway (wayland compositor) plus the portal integration
# packages cloud-init, sshd, and NetworkManager need to be reachable and
# configurable from the host on first boot.
Packages=
        kernel
        linux-firmware
        sudo
        openssh-server
        cloud-init
        cloud-utils-growpart
        NetworkManager
        polkit
        mesa-dri-drivers
        mesa-vulkan-drivers
        seatd
        sway
        foot
        git
        vim-enhanced
        nano
        bash-completion
        zstd
