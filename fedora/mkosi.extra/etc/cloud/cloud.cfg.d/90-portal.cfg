system_info:
  default_user:
    name: portal
    lock_passwd: false
    gecos: Portal default user
    groups: [wheel, video, input, render, seat]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash

# password login is enabled so a fresh guest is reachable before an ssh key is injected.
# the host app is expected to inject an authorized key and rotate or disable this at first boot.
ssh_pwauth: true
disable_root: true

chpasswd:
  expire: true
  list:
    - portal:portal

users:
  - default

runcmd:
  - [systemctl, enable, --now, sshd.service]
  - [systemctl, enable, --now, NetworkManager.service]
