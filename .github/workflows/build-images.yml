name: build-images

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      image:
        description: "which curated image to build"
        type: choice
        options: [all, arch, fedora]
        default: all

permissions:
  contents: write

jobs:
  build-disk-image:
    name: build and sign ready-to-boot disk image
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.image == 'all' || github.event.inputs.image == 'arch'
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: free disk space
        run: |
          # default runner disk is mostly consumed by preinstalled toolchains
          # this job doesn't need - reclaim it before a disk-heavy image build
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h /

      - name: install host tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs minisign qemu-user-static binfmt-support zstd

      - name: download arch linux arm rootfs
        run: |
          curl -L -o rootfs.tar.gz http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz

      - name: bootstrap rootfs as real root
        run: |
          sudo mkdir -p rootfs
          sudo tar -xpf rootfs.tar.gz -C rootfs
          rm -f rootfs.tar.gz
          # devtmpfs populates /dev at guest boot, no need to preserve host-extracted dev nodes
          sudo rm -rf rootfs/dev
          sudo mkdir -p rootfs/dev

      - name: install packages via chroot under aarch64 emulation
        run: |
          sudo cp /usr/bin/qemu-aarch64-static rootfs/usr/bin/
          sudo mount -t proc /proc rootfs/proc
          sudo mount -t sysfs /sys rootfs/sys
          sudo mount --bind /dev rootfs/dev
          sudo rm -f rootfs/etc/resolv.conf
          cat /etc/resolv.conf | sudo tee rootfs/etc/resolv.conf > /dev/null

          # pacman's disk-space check relies on statvfs, which qemu-user's aarch64
          # emulation does not implement correctly - disable the check itself
          # rather than the space it (incorrectly) reports as missing
          sudo sed -i '/^CheckSpace/d' rootfs/etc/pacman.conf

          PACKAGES=$(grep -vE '^\s*#|^\s*$' arch-spin/packages.aarch64 | tr '\n' ' ')

          sudo chroot rootfs /usr/bin/qemu-aarch64-static /usr/bin/bash -c "
            set -e
            pacman-key --init
            pacman-key --populate archlinuxarm
            pacman -Syu --noconfirm --disable-sandbox
            pacman -S --noconfirm --disable-sandbox ${PACKAGES}
            pacman -Scc --noconfirm
          "

          sudo umount -l rootfs/proc rootfs/sys rootfs/dev

      - name: apply portal guest configuration
        run: |
          sudo cp -a arch-spin/airootfs/etc/. rootfs/etc/
          sudo mount -t proc /proc rootfs/proc
          sudo mount -t sysfs /sys rootfs/sys
          sudo mount --bind /dev rootfs/dev
          sudo chroot rootfs /usr/bin/qemu-aarch64-static /usr/bin/systemctl enable sshd cloud-init.target
          sudo umount -l rootfs/proc rootfs/sys rootfs/dev
          sudo rm -f rootfs/usr/bin/qemu-aarch64-static

      - name: extract kernel and initramfs
        run: |
          mkdir -p out
          sudo cp rootfs/boot/Image out/kernel
          sudo cp rootfs/boot/initramfs-linux.img out/initrd
          sudo chown "$(id -u)":"$(id -g)" out/kernel out/initrd

      - name: build raw ext4 disk image
        run: |
          mkdir -p out
          sudo /sbin/mkfs.ext4 -F -L archroot -d rootfs out/portal-arch.img 6G
          sudo chown "$(id -u)":"$(id -g)" out/portal-arch.img

      - name: compress disk image
        run: |
          # GitHub Releases caps a single asset at 2 GiB - the raw 6G image is
          # mostly zero-filled unused space, which zstd compresses away almost
          # entirely, so ship the compressed image and have the client
          # decompress after verifying it, rather than uploading the raw file.
          zstd -T0 -19 --long=27 out/portal-arch.img -o out/portal-arch.img.zst
          rm -f out/portal-arch.img
          ls -lh out/

      - name: compute sha256
        run: |
          sha256sum out/portal-arch.img.zst out/kernel out/initrd | tee out/portal-arch.img.zst.sha256

      - name: sign with minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_KEY_PASSWORD: ${{ secrets.MINISIGN_KEY_PASSWORD }}
        run: |
          printf '%s' "$MINISIGN_SECRET_KEY" > minisign.key
          echo "$MINISIGN_KEY_PASSWORD" | minisign -S -s minisign.key -m out/portal-arch.img.zst
          rm -f minisign.key

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arch-spin-disk-${{ github.run_number }}
          files: |
            out/portal-arch.img.zst
            out/portal-arch.img.zst.sha256
            out/portal-arch.img.zst.minisig
            out/kernel
            out/initrd

  build-fedora-disk-image:
    name: build and sign ready-to-boot fedora disk image
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.image == 'all' || github.event.inputs.image == 'fedora'
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: free disk space
        run: |
          # default runner disk is mostly consumed by preinstalled toolchains
          # this job doesn't need - reclaim it before a disk-heavy image build
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h /

      - name: install host tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs minisign qemu-user-static binfmt-support zstd pipx debootstrap
          # mkosi isn't on pypi under this name - install straight from the
          # project's own repo, the method upstream documents
          pipx install git+https://github.com/systemd/mkosi.git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: build fedora rootfs with mkosi
        working-directory: fedora
        run: |
          MKOSI_BIN=$(command -v mkosi)
          echo "mkosi resolved at: $MKOSI_BIN"
          # unprivileged user namespaces are locked down on this runner image
          # (ubuntu's apparmor userns restriction), so mkosi's own privilege
          # acquisition via unshare fails - run it as real root instead.
          # sudo does its own PATH lookup (secure_path), which may not include
          # wherever pipx put the symlink, so invoke the resolved absolute path
          sudo "$MKOSI_BIN"

      - name: extract kernel and initramfs
        run: |
          mkdir -p out
          sudo cp fedora/rootfs/boot/vmlinuz-* out/kernel
          sudo cp fedora/rootfs/boot/initramfs-*.img out/initrd
          sudo chown "$(id -u)":"$(id -g)" out/kernel out/initrd

      - name: build raw ext4 disk image
        run: |
          mkdir -p out
          sudo /sbin/mkfs.ext4 -F -L fedoraroot -d fedora/rootfs out/portal-fedora.img 6G
          sudo chown "$(id -u)":"$(id -g)" out/portal-fedora.img

      - name: compress disk image
        run: |
          # GitHub Releases caps a single asset at 2 GiB - the raw 6G image is
          # mostly zero-filled unused space, which zstd compresses away almost
          # entirely, so ship the compressed image and have the client
          # decompress after verifying it, rather than uploading the raw file.
          zstd -T0 -19 --long=27 out/portal-fedora.img -o out/portal-fedora.img.zst
          rm -f out/portal-fedora.img
          ls -lh out/

      - name: compute sha256
        run: |
          sha256sum out/portal-fedora.img.zst out/kernel out/initrd | tee out/portal-fedora.img.zst.sha256

      - name: sign with minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_KEY_PASSWORD: ${{ secrets.MINISIGN_KEY_PASSWORD }}
        run: |
          printf '%s' "$MINISIGN_SECRET_KEY" > minisign.key
          echo "$MINISIGN_KEY_PASSWORD" | minisign -S -s minisign.key -m out/portal-fedora.img.zst
          rm -f minisign.key

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fedora-disk-${{ github.run_number }}
          files: |
            out/portal-fedora.img.zst
            out/portal-fedora.img.zst.sha256
            out/portal-fedora.img.zst.minisig
            out/kernel
            out/initrd
